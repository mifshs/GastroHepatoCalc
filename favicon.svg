<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Apple-style rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <!-- Elegant gastro-medical icon: Cross + Gastro pulse wave -->
  <g filter="url(#glow)">
    <!-- Medical Cross -->
    <path d="M32 14v36M14 32h36" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Organic stomach contour / pulse -->
    <path d="M22 32c2-6 7-9 10-9s8 3 10 9-4 13-10 13-8-4-10-13z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <!-- Central pulse dot -->
    <circle cx="32" cy="32" r="3.2" fill="#38bdf8"/>
  </g>
</svg>
